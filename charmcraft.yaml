type: charm

platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    source: .
    build-snaps:
      - rustup
    build-packages:
      - libffi-dev
      - libssl-dev
      - pkg-config
    override-build: |
      rustup default stable
      craftctl default
  velero:
    plugin: dump
    source:
      - on amd64: https://github.com/vmware-tanzu/velero/releases/download/v1.15.2/velero-v1.15.2-linux-amd64.tar.gz
    source-type: tar
    stage:
      - velero
