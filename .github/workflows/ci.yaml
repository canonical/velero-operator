name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  schedule:
    - cron: '0 8 * * TUE'
  # Triggered on push by .github/workflows/release.yaml
  workflow_call:
    outputs:
      artifact-prefix:
        description: build_charm.yaml `artifact-prefix` output
        value: ${{ jobs.build.outputs.artifact-prefix }}
      track:
        description: Charmhub track determined from branch name
        value: ${{ jobs.get-track.outputs.track }}

jobs:
  get-track:
    name: Get track
    runs-on: ubuntu-latest
    outputs:
      track: ${{ steps.determine-track.outputs.track }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine track
        id: determine-track
        shell: python
        run: |
          import os

          if "${{ github.event_name }}" == "pull_request":
              ref = "${{ github.base_ref }}"
          else:
              ref = "${{ github.ref_name }}"

          if ref.startswith("track/"):
              track = ref.removeprefix("track/")
          else:
              track = "latest"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"track={track}\n")

          print(f"Track: {track}")

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install tox
      - run: tox -vve lint

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install tox
      - run: tox -e unit

  promtool:
    name: Prometheus rules check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install prometheus snap
        run: sudo snap install prometheus
      - name: Check validity of prometheus alert rules
        run: promtool check rules src/prometheus_alert_rules/*.yaml
      - name: Run unit tests for prometheus alert rules
        run: promtool test rules tests/unit/test_alert_rules/*.yaml

  build:
    name: Build charm
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v51.0.0
    with:
      path-to-charm-directory: .
      cache: true
    permissions:
      actions: read
      contents: read

  build-test-charm:
    name: Build test charm
    uses: canonical/data-platform-workflows/.github/workflows/build_charm.yaml@v51.0.0
    with:
      path-to-charm-directory: tests/integration/test_charm
      cache: true
    permissions:
      actions: read
      contents: read

  release:
    name: Release charm to Charmhub branch
    if: ${{ github.event_name == 'pull_request' }}
    needs:
      - get-track
      - build
    uses: canonical/data-platform-workflows/.github/workflows/release_charm_pr.yaml@v51.0.0
    with:
      track: ${{ needs.get-track.outputs.track }}
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
      path-to-charm-directory: .
    secrets:
      charmhub-token: ${{ secrets.CHARMHUB_TOKEN_EDGE_PR }}
    permissions:
      actions: read
      contents: read

  integration:
    name: Integration tests
    needs:
      - build
      - build-test-charm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_file:
          - tests/integration/test_charm.py
          - tests/integration/test_s3_relation.py
          - tests/integration/test_azure_relation.py
          - tests/integration/test_gcs_relation.py
          - tests/integration/test_backup_relation.py
          - tests/integration/test_schedule.py
          - tests/integration/test_metrics.py
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pipx install tox

      - name: Setup environment
        run: |
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io
          sudo rm -rf /run/containerd
          sudo snap install concierge --classic
          sudo concierge prepare --trace

      - name: Download packed charm(s)
        timeout-minutes: 5
        uses: actions/download-artifact@v4
        with:
          pattern: packed-charm-*
          merge-multiple: true

      - name: Integration tests
        env:
          VELERO_OPERATOR_CHARM_PATH: ${{ github.workspace }}/velero-operator_ubuntu@24.04-amd64.charm
          TEST_CHARM_PATH: ${{ github.workspace }}/tests/integration/test_charm/test-charm-velero_ubuntu@24.04-amd64.charm
        run: tox -vve integration -- --model testing ${{ matrix.test_file }}

      - name: Get all
        run: kubectl get all -A
        if: failure()

      - name: Describe deployments
        run: kubectl describe deployments -A
        if: failure()

      - name: Describe Velero Storage locations
        run: |
          kubectl describe backupstoragelocations -A
          kubectl describe volumesnapshotlocations -A
        if: failure()

      - name: Describe Velero Backups and Restores
        run: |
          kubectl describe backups -A
          kubectl describe restores -A
        if: failure()

      - name: Describe replicasets
        run: kubectl describe replicasets -A
        if: failure()

      - name: Get juju status
        run: juju status
        if: always()

      - name: Get operator logs
        run: kubectl logs --tail 100 -n testing -l app.kubernetes.io/name=velero-operator -c charm
        if: failure()

      - name: Save debug artifacts
        uses: canonical/kubeflow-ci/actions/dump-charm-debug-artifacts@main
        if: failure()
